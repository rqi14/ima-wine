name: image

on:
  push:
    branches: [main]
    paths: [Dockerfile, 'wine/**', 'docker/**', 'imactl/**', .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # a cold Wine build on a 4-core runner takes ~1 h
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # the Wine stage only rebuilds when wine/*.patch or the Wine version change
          cache-from: type=gha
          cache-to: type=gha,mode=max
